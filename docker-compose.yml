services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__Provider: Sqlite
      ConnectionStrings__Default: "Data Source=/data/mesa_whatsapp.db"
      Hangfire__Storage: Memory
      WHATSAPP_BUSINESS_ACCOUNT_ID: ${WHATSAPP_BUSINESS_ACCOUNT_ID}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN}
      GRAPH_API_VERSION: ${GRAPH_API_VERSION:-v20.0}
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-en}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      JWT_ISSUER: ${JWT_ISSUER:-Mesa.WhatsApp}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-Mesa.WhatsApp.Admin}
    volumes:
      - mesa-data:/data
      - mesa-media:/app/media
      - mesa-logs:/app/logs
    restart: unless-stopped

  admin-ui:
    build:
      context: ./admin-ui
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mesa-data:
  mesa-media:
  mesa-logs:
